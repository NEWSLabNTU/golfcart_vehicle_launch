[package]
name = "golfcart_vehicle_interface"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# Default cargo discovery picks up `src/main.rs` plus any `src/bin/*.rs`.
# `mock_vcu` lives at `src/bin/mock_vcu.rs` so it doesn't need to be listed
# explicitly.
[[bin]]
name = "golfcart_vehicle_interface"
path = "src/main.rs"

[[bin]]
name = "mock_vcu"
path = "src/bin/mock_vcu.rs"

[dependencies]
anyhow = "1.0"
bitvec = "1"
parking_lot = "0.12"
socketcan = "3.5"
thiserror = "2.0"

# ROS 2 dependencies (resolved via ament_index by colcon-cargo-ros2)
rclrs = "*"
builtin_interfaces = "*"
std_msgs = "*"
diagnostic_msgs = "*"
autoware_control_msgs = "*"
autoware_vehicle_msgs = "*"
tier4_vehicle_msgs = "*"

[build-dependencies]
anyhow = "1.0"
dbc-codegen = "0.3"

[features]
# dbc-codegen output gates `Debug` impls on `cfg(feature = "debug")` for the
# message structs and on `cfg(any(feature = "debug", feature = "std"))` for
# `CanError`. Enable both so `StatusState`'s `derive(Debug)` and our `.expect`
# calls compile.
default = ["debug", "std"]
debug = []
std = []
