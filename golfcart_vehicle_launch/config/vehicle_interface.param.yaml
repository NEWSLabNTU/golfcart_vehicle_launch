/**:
  ros__parameters:
    # SocketCAN interface name; mandatory, no default in code.
    can_interface: can0
    # Master enable for CAN TX. When false, the node runs all of its logic
    # but skips the final socket write so it cannot drive the vehicle. RX
    # still flows so reports/diagnostics remain populated. Default false for
    # safety; production launches must opt in via `tx_enabled:=true`.
    tx_enabled: false
    # ADS_VCU_* command frame rate (Hz).
    tx_rate_hz: 100.0
    # Autoware vehicle status report rate (Hz).
    publish_rate_hz: 50.0
    # Frame ID for VelocityReport.header.
    frame_id: base_link
    # Autoware counts a positive steering_tire_angle to the LEFT (REP-103);
    # ROOTS counts it to the right, so the sign is flipped on the way to the
    # VCU and on the way back from it. Set false only if a VCU build changes
    # that convention - with the wrong value the cart steers the wrong way.
    invert_steering: true
    # Minimum Autoware Control publish rate (Hz) required to command a speed.
    # Below it the speed setpoint is held at 0 and a throttled warning is
    # logged: a planner updating a few times a second leaves the cart driving
    # blind between updates. Steering, gear and brake still pass through, and
    # total silence is handled by control_timeout_ms. 0 disables the check.
    control_min_rate_hz: 10.0
    # Commanded decelerations below this (m/s^2) are sent as none. Any
    # Target_Deceleration > 0 makes the VCU cut motor torque, yet ROOTS does
    # not brake below 1.2 m/s^2, so Autoware's PID dithering around zero at
    # cruise would toggle the motor. Must be in [0, 1.2); 0 disables.
    decel_deadband_mps2: 0.2
    # wheel_base (for VelocityReport.heading_rate) is NOT set here: the launch
    # passes it from golfcart_vehicle_description's vehicle_info.param.yaml.
