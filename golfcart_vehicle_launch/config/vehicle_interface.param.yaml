/**:
  ros__parameters:
    # SocketCAN interface name; mandatory, no default in code.
    can_interface: can0
    # ADS_VCU_* command frame rate (Hz).
    tx_rate_hz: 100.0
    # Autoware vehicle status report rate (Hz).
    publish_rate_hz: 50.0
    # Frame ID for VelocityReport.header.
    frame_id: base_link
    # Autoware counts a positive steering_tire_angle to the LEFT (REP-103);
    # ROOTS counts it to the right, so the sign is flipped on the way to the
    # VCU and on the way back from it. Set false only if a VCU build changes
    # that convention - with the wrong value the cart steers the wrong way.
    invert_steering: true
    # Minimum Autoware Control publish rate (Hz) required to command a speed.
    # Below it the speed setpoint is held at 0 and a throttled warning is
    # logged: a planner updating a few times a second leaves the cart driving
    # blind between updates. Steering, gear and brake still pass through, and
    # total silence is handled by control_timeout_ms. 0 disables the check.
    control_min_rate_hz: 10.0
    # How long (ms) the vehicle must sit in Manual (all four VCU subsystems,
    # fresh frames) with no VCU hazard bit before the ECU-hazard latch clears
    # itself; 0 disables. On 2026-11-09 (session 20261109_232854) the VCU set
    # Vcu_Ads_Error_Code_Mtr for a frame or a few 1-3 s after every dashboard
    # AUTO -> Manual; the latch then held control_mode at DISENGAGED and refused
    # the next AUTO until MANUAL was sent by hand. In Manual we command nothing,
    # so the latch protects nothing there, and a hazard still present on
    # entering AUTO re-latches at once. The CAN TX failure latch never clears
    # on its own.
    fault_clear_hold_ms: 2000
    # Hard ceiling on the commanded speed (m/s), whatever Autoware asks for;
    # the code default is 5.0. 2.5 (9 km/h) since 2026-11-02, raised from the
    # Phase 8 S4 first-run cap of 1.5 after the first supervised autonomous run:
    # at 1.5 it equalled min_speed_mps and left the planner no speed range at
    # all. Raise it deliberately.
    # Autoware's planning_speed_limit is only the planner's startup default and
    # can be changed at runtime; this is the ceiling. Effective cap is
    # min(max_speed_mps, 6.944), the ROOTS 25 km/h limit.
    max_speed_mps: 2.5
    # Floor for any nonzero speed setpoint (m/s; 0 disables, never above
    # max_speed_mps). A planner request below it is raised to it; a setpoint of
    # zero is left alone, so stopping is unaffected. 0.8 m/s (2.9 km/h) since
    # 2026-11-10, so the Ming-Da loop's 3 km/h north lane (0.83 m/s) is sent as
    # asked. It was 1.5 (5.4 km/h), set when the cart stalled on a bump at a
    # crawl; that was with the setpoint read as km/h, and the low end has not
    # been driven since the m/s update. If the cart stalls at 3 km/h, raise it
    # back towards 1.5 and the slow lanes run at the floor.
    min_speed_mps: 0.8
    # Commanded decelerations below this (m/s^2) are sent as none. Any
    # Target_Deceleration > 0 makes the VCU cut motor torque, yet ROOTS does
    # not brake below 1.2 m/s^2, so Autoware's PID dithering around zero at
    # cruise would toggle the motor. Must be in [0, 1.2); 0 disables.
    decel_deadband_mps2: 0.2
    # wheel_base (for VelocityReport.heading_rate) is NOT set here: the launch
    # passes it from golfcart_vehicle_description's vehicle_info.param.yaml.
